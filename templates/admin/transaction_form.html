{% extends 'base.html' %}
{% block title %}New Transaction — Zagadat Capital{% endblock %}
{% block content %}
<div class="page-content">
  <div class="page-header">
    <div><h1>New Transaction</h1><p>Record a cash deposit, withdrawal or transfer</p></div>
    <a href="{{ url_for('admin.transactions') }}" class="btn btn-secondary">← Back</a>
  </div>
  <form method="POST" style="max-width:700px;">
  <div class="form-section">
    <h3>Transaction Details</h3>
    <div class="form-grid form-grid-2">
      <div class="form-group">
        <label>Client Account *</label>
        <select name="account_number" required id="txn-acc" onchange="showBalance()">
          <option value="">— Select Account —</option>
          {% for acc in accounts %}
          <option value="{{ acc.account_number }}" {{ 'selected' if request.args.get('acc')==acc.account_number }}>
            {{ acc.account_number }} — {{ acc.full_name }}
          </option>
          {% endfor %}
        </select>
        <div id="txn-balance" style="font-size:11px;color:var(--gold);margin-top:4px;"></div>
      </div>
      <div class="form-group">
        <label>Transaction Type *</label>
        <select name="txn_type" required>
          <option value="DEPOSIT">Deposit</option>
          <option value="WITHDRAWAL">Withdrawal</option>
          <option value="TRANSFER_IN">Transfer In</option>
          <option value="TRANSFER_OUT">Transfer Out</option>
          <option value="DIVIDEND">Dividend</option>
          <option value="COUPON">Coupon Payment</option>
          <option value="SELL">Sale Proceeds</option>
          <option value="FEE">Management Fee</option>
        </select>
      </div>
      <div class="form-group">
        <label>Transaction Date *
          {% if not current_user.is_super_admin %}
          <span style="font-size:9px;color:var(--grey);font-weight:400;letter-spacing:0;">(today only — Super Admin can backdate)</span>
          {% endif %}
        </label>
        <input type="date" name="txn_date" id="txn-date" required
               {% if not current_user.is_super_admin %}readonly style="opacity:.6;cursor:not-allowed;"{% endif %}>
      </div>
      <div class="form-group">
        <label>Currency</label>
        <select name="currency">
          <option value="GHS">GHS</option><option value="USD">USD</option>
          <option value="EUR">EUR</option><option value="GBP">GBP</option>
          <option value="CNY">CNY</option><option value="NGN">NGN</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount *</label>
        <input type="number" step="0.01" name="amount" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Reference / Cheque No.</label>
        <input type="text" name="reference" placeholder="REF-001">
      </div>
      <div class="form-group span-full">
        <label>Description</label>
        <input type="text" name="description" placeholder="e.g. Initial deposit from client">
      </div>
    </div>
  </div>
  <div class="flex gap-2" style="justify-content:flex-end;">
    <a href="{{ url_for('admin.transactions') }}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary">Record Transaction</button>
  </div>
  </form>
</div>
<script>
async function showBalance() {
  const acc = document.getElementById('txn-acc').value;
  if (!acc) return;
  const r = await fetch('/api/portfolio-summary/'+acc);
  const d = await r.json();
  document.getElementById('txn-balance').textContent =
    `Cash Balance: ${d.currency} ${d.cash_balance.toLocaleString('en',{minimumFractionDigits:2})}`;
}
document.getElementById('txn-acc').addEventListener('change', showBalance);
document.getElementById('txn-date').valueAsDate = new Date();
</script>
{% endblock %}
